<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t d">
<title id="t">Syed Ahmer Shah — Software Engineer &amp; Full-Stack Developer</title>
<desc id="d">Designing order within the digital wilderness. Six platforms built solo with Laravel, Django, Flask, React and MySQL. Hyderabad, Pakistan.</desc>
<defs>
  <radialGradient id="gG" cx="0.82" cy="0.25" r="0.55"><stop offset="0" stop-color="#4cc22e" stop-opacity=".30"/><stop offset="1" stop-color="#4cc22e" stop-opacity="0"/></radialGradient>
  <radialGradient id="gB" cx="0.62" cy="1.05" r="0.55"><stop offset="0" stop-color="#1e4fd8" stop-opacity=".38"/><stop offset="1" stop-color="#1e4fd8" stop-opacity="0"/></radialGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4cc22e"/><stop offset=".5" stop-color="#2dd4c4"/><stop offset="1" stop-color="#1e4fd8"/></linearGradient>
  <linearGradient id="laser" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ee05a" stop-opacity="0"/><stop offset=".5" stop-color="#7ee05a"/><stop offset="1" stop-color="#7ee05a" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
  <clipPath id="card"><rect width="1280" height="440" rx="28"/></clipPath>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <style>
    .sans { font-family: Outfit, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .scan { animation: scan 7s cubic-bezier(.16,1,.3,1) infinite; }
    @keyframes scan { 0% { transform: translateX(-260px); opacity: 0 } 12% { opacity: 1 } 60% { transform: translateX(260px); opacity: .9 } 70%,100% { transform: translateX(260px); opacity: 0 } }
    .ping { animation: ping 2.2s ease-out infinite; transform-origin: 96px 383px; }
    @keyframes ping { 0% { transform: scale(1); opacity: .7 } 100% { transform: scale(3.2); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .scan, .ping { animation: none } }
  </style>
</defs>
<g clip-path="url(#card)">
  <rect width="1280" height="440" fill="#0b0d11"/>
  <rect width="1280" height="440" fill="url(#grid)"/>
  <rect width="1280" height="440" fill="url(#gG)"/>
  <rect width="1280" height="440" fill="url(#gB)"/>
  <line x1="40" y1="460" x2="330" y2="-40" stroke="#4cc22e" stroke-opacity=".28"/>
  <line x1="120" y1="460" x2="410" y2="-40" stroke="#4b7bff" stroke-opacity=".22"/>

  <g transform="translate(905 220)">
    <circle r="132" fill="none" stroke="#ffffff" stroke-opacity=".07"/>
    <circle r="104" fill="none" stroke="url(#brand)" stroke-opacity=".55" stroke-dasharray="4 10"/>
    <circle r="78" fill="#f5f7fa"/>
    <image x="-62" y="-62" width="124" height="124" href="data:image/webp;base64,"/>
    <g class="scan"><line x1="0" y1="-190" x2="-110" y2="190" stroke="url(#laser)" stroke-width="10" filter="url(#glow)" opacity=".7"/><line x1="0" y1="-190" x2="-110" y2="190" stroke="url(#laser)" stroke-width="2.4"/></g>
  </g>

  <text x="80" y="74" class="mono" font-size="14" letter-spacing="4.5" fill="#f5f7fa" fill-opacity=".6">SOFTWARE ENGINEER · FULL-STACK · @AHMERSHAHDEV</text>
  <rect x="80" y="92" width="48" height="2" fill="#4cc22e"/>
  <text x="76" y="190" class="sans" font-size="92" font-weight="700" letter-spacing="-3"><tspan fill="#4cc22e">Syed</tspan><tspan fill="#f5f7fa"> Ahmer</tspan></text>
  <text x="76" y="282" class="sans" font-size="92" font-weight="700" letter-spacing="-3" fill="#4b7bff">Shah</text>
  <text x="80" y="330" class="sans" font-size="24" font-weight="500" fill="#f5f7fa" fill-opacity=".72">Designing order within the <tspan fill="#f5f7fa" fill-opacity="1">digital wilderness.</tspan></text>

  <circle class="ping" cx="96" cy="383" r="5" fill="#4cc22e"/>
  <circle cx="96" cy="383" r="5" fill="#4cc22e"/>
  <text x="112" y="388" class="mono" font-size="14" letter-spacing="2.5" fill="#f5f7fa" fill-opacity=".8">AVAILABLE FOR PROJECTS · LARAVEL · DJANGO · REACT · MYSQL</text>

  <text x="1200" y="410" class="mono" font-size="13" letter-spacing="2" fill="#f5f7fa" fill-opacity=".55" text-anchor="end">ahmershah.dev</text>
  <rect y="434" width="1280" height="6" fill="url(#brand)"/>
</g>
</svg>
