<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
<title id="t">Syed Ahmer Shah — Full-Stack Developer &amp; Software Engineer</title>
<desc id="d">Designing order within the digital wilderness. Full-stack developer and software engineering undergraduate from Hyderabad, Pakistan.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102C56"/><stop offset="1" stop-color="#061B3A"/></linearGradient>
  <linearGradient id="gr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7AC943"/><stop offset=".55" stop-color="#39B54A"/><stop offset="1" stop-color="#11793B"/></linearGradient>
  <radialGradient id="glowG" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#39B54A" stop-opacity=".55"/><stop offset="1" stop-color="#39B54A" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowB" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2A5CA8" stop-opacity=".5"/><stop offset="1" stop-color="#2A5CA8" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".05"/></pattern>
  <clipPath id="clip"><rect width="1280" height="420" rx="24"/></clipPath>
  <style>
    .sans{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'SFMono-Regular',Menlo,monospace}
    .g1{animation:drift 14s ease-in-out infinite alternate}
    .g2{animation:drift 18s ease-in-out infinite alternate-reverse}
    .line{stroke-dasharray:220;animation:draw 1.6s cubic-bezier(.65,0,.35,1) .3s both}
    .up{animation:up .9s cubic-bezier(.16,1,.3,1) both}
    .d1{animation-delay:.15s} .d2{animation-delay:.35s} .d3{animation-delay:.55s} .d4{animation-delay:.75s}
    .logo{animation:float 6s ease-in-out infinite}
    .cur{animation:blink 1.1s steps(1) infinite}
    @keyframes drift{from{transform:translate(0,0)}to{transform:translate(60px,-30px)}}
    @keyframes draw{from{stroke-dashoffset:220}to{stroke-dashoffset:0}}
    @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</defs>
<g clip-path="url(#clip)">
  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <ellipse class="g1" cx="140" cy="400" rx="420" ry="260" fill="url(#glowG)"/>
  <ellipse class="g2" cx="1180" cy="40" rx="420" ry="260" fill="url(#glowB)"/>

  <!-- top rail -->
  <text class="mono up" x="64" y="62" font-size="13" letter-spacing="2.5" fill="#8FA3C4">@AHMERSHAHDEV — PORTFOLIO 2026</text>
  <line x1="64" y1="86" x2="1216" y2="86" stroke="#FFFFFF" stroke-opacity=".08"/>

  <!-- logo -->
  <g class="logo"><circle cx="190" cy="232" r="96" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".10"/>
  <image x="110" y="152" width="160" height="160" href="data:image/webp;base64," xlink:href="data:image/webp;base64,"/></g>

  <!-- headline -->
  <text class="mono up d1" x="340" y="150" font-size="14" letter-spacing="3" fill="#39B54A">&lt; SYED AHMER SHAH /&gt;<tspan class="cur" fill="#39B54A"> _</tspan></text>
  <text class="sans up d2" x="338" y="222" font-size="58" font-weight="700" letter-spacing="-1.8" fill="#F4F7FB">Designing order</text>
  <text class="sans up d3" x="338" y="288" font-size="58" font-weight="700" letter-spacing="-1.8" fill="url(#gr)">within the digital wilderness.</text>
  <line class="line" x1="340" y1="322" x2="560" y2="322" stroke="#39B54A" stroke-width="3" stroke-linecap="round"/>

  <!-- bottom rail -->
  <line x1="64" y1="358" x2="1216" y2="358" stroke="#FFFFFF" stroke-opacity=".08"/>
  <g class="up d4 mono" font-size="13" letter-spacing="2.5" fill="#8FA3C4">
    <text x="64" y="388">FULL-STACK DEVELOPER · SOFTWARE ENGINEER</text>
    <text x="640" y="388" text-anchor="middle">HYDERABAD, PK · 25.39°N 68.37°E</text>
    <text x="1216" y="388" text-anchor="end" fill="#CFE9D3">AHMERSHAH.DEV ↗</text>
  </g>
</g>
<rect x=".5" y=".5" width="1279" height="419" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
</svg>
